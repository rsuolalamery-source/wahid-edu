<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة واحد تعليم</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; text-align: center; }
    .card { background: white; max-width: 450px; margin: 40px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #0070f3; color: white; border: none; font-weight: bold; cursor: pointer; }
    .hidden { display: none; }
    iframe { width: 100%; height: 250px; border: none; border-radius: 8px; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- واجهة الطلاب وتسجيل الدخول الموحدة -->
  <div id="loginCard" class="card">
    <h2>منصة واحد تعليم</h2>
    <p>أهلاً بك، يرجى تسجيل الدخول</p>
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="handleLogin()">دخول</button>
  </div>

  <!-- لوحة تحكم المدير (مخفية تماماً وتفتح فقط عند كتابة admin / 123456) -->
  <div id="adminPanel" class="card hidden">
    <h2>لوحة تحكم المدير 🔒</h2>
    <p>أدخل رابط درس يوتيوب لنشره للطلاب:</p>
    <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=...">
    <button onclick="publishLesson()">نشر الدرس فوريًا</button>
    <button onclick="logout()" style="background:#666;">تسجيل الخروج</button>
  </div>

  <!-- عرض الفيديو للمستخدمين -->
  <div id="videoCard" class="card hidden">
    <h3>الدرس الحالي</h3>
    <iframe id="player" src="" allowfullscreen></iframe>
  </div>

  <script>
    function handleLogin() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      if (u === 'admin' && p === '123456') {
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
      } else {
        // دخول الطالب العادي
        document.getElementById('loginCard').classList.add('hidden');
        loadLesson();
      }
    }

    function publishLesson() {
      const url = document.getElementById('ytUrl').value;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);

      if (match && match[2].length === 11) {
        const embedUrl = 'https://www.youtube.com/embed/' + match[2];
        localStorage.setItem('currentLesson', embedUrl);
        alert('تم نشر الدرس بنجاح!');
        loadLesson();
      } else {
        alert('يرجى كتابة رابط يوتيوب صحيح');
      }
    }

    function loadLesson() {
      const saved = localStorage.getItem('currentLesson');
      if (saved) {
        document.getElementById('player').src = saved;
        document.getElementById('videoCard').classList.remove('hidden');
      }
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
